services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: singalong-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      # salas e fila em SQLite, num volume do Docker (arquivos SQLite não gostam de bind mounts no Windows)
      DB_PATH: /data/singalong.db
      # endereço que os celulares usam para chegar aqui (vai no QR code da TV), ex.: http://192.168.0.10:3000
      PUBLIC_URL: ${PUBLIC_URL:-}
      # limite do cache de músicas em GB: acima disso apaga as menos cantadas (0 desliga)
      CACHE_MAX_GB: ${CACHE_MAX_GB:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Worker em CPU:  docker compose --profile cpu up
  worker:
    profiles: ["cpu"]
    build:
      context: ./apps/worker
      args:
        TORCH_INDEX: cpu
    image: singalong-worker:cpu
    command: ["--consume"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      YTDLP_COOKIES: /secrets/youtube_cookies.txt
      DEMUCS_DEVICE: cpu
      # limites e robustez (0 desliga o limite)
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      SEPARATE_TIMEOUT_SECONDS: ${SEPARATE_TIMEOUT_SECONDS:-900}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage
      - ./secrets:/secrets:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
    # o worker toca /tmp/worker-heartbeat a cada 10 s; sem isso por 1 min ele está travado
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # dá tempo de terminar a música em andamento antes de encerrar
    stop_grace_period: 3m
    restart: unless-stopped

  # Worker com GPU NVIDIA:  docker compose --profile gpu up
  worker-gpu:
    profiles: ["gpu"]
    build:
      context: ./apps/worker
      args:
        TORCH_INDEX: cu121
    image: singalong-worker:gpu
    command: ["--consume"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      YTDLP_COOKIES: /secrets/youtube_cookies.txt
      DEMUCS_DEVICE: cuda
      # limites e robustez (0 desliga o limite)
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      SEPARATE_TIMEOUT_SECONDS: ${SEPARATE_TIMEOUT_SECONDS:-900}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage
      - ./secrets:/secrets:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
    # o worker toca /tmp/worker-heartbeat a cada 10 s; sem isso por 1 min ele está travado
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # dá tempo de terminar a música em andamento antes de encerrar
    stop_grace_period: 3m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis-data:
  api-data:
  models:
