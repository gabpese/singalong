services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: singalong-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
    volumes:
      - ./storage:/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Worker em CPU:  docker compose --profile cpu up
  worker:
    profiles: ["cpu"]
    build:
      context: ./apps/worker
      args:
        TORCH_INDEX: cpu
    image: singalong-worker:cpu
    command: ["--consume"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      YTDLP_COOKIES: /secrets/youtube_cookies.txt
      DEMUCS_DEVICE: cpu
    volumes:
      - ./storage:/storage
      - ./secrets:/secrets:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker com GPU NVIDIA:  docker compose --profile gpu up
  worker-gpu:
    profiles: ["gpu"]
    build:
      context: ./apps/worker
      args:
        TORCH_INDEX: cu121
    image: singalong-worker:gpu
    command: ["--consume"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      YTDLP_COOKIES: /secrets/youtube_cookies.txt
      DEMUCS_DEVICE: cuda
    volumes:
      - ./storage:/storage
      - ./secrets:/secrets:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis-data:
  models:
