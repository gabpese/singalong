services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: singalong-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      # Rooms and the Queue in SQLite, in a Docker volume (SQLite files do not like bind mounts on Windows)
      DB_PATH: /data/singalong.db
      # the address the phones use to reach this (it goes in the TV's QR code), e.g. http://192.168.0.10:3000
      PUBLIC_URL: ${PUBLIC_URL:-}
      # the songs cache's limit in GB: above it the least sung ones are deleted (0 turns it off)
      CACHE_MAX_GB: ${CACHE_MAX_GB:-20}
      # the administrator's secret: turns on the local agent's pairing (/agent/v1); empty = off
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_PATH: ${ADMIN_PATH:-}
      APP_LATEST_VERSION: ${APP_LATEST_VERSION:-}
      APP_MIN_VERSION: ${APP_MIN_VERSION:-}
      APP_NOTES: ${APP_NOTES:-}
      # the Intermission (seconds): the Applause after each song and Taking the stage for the next singer (0 turns the phase off)
      INTERMISSION_APPLAUSE_SECONDS: ${INTERMISSION_APPLAUSE_SECONDS:-15}
      INTERMISSION_STAGE_SECONDS: ${INTERMISSION_STAGE_SECONDS:-15}
      APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
      PAIR_ALLOWED_EMAILS: ${PAIR_ALLOWED_EMAILS:-}
      ENABLED_TO_SEND_TO_CLOUD: ${ENABLED_TO_SEND_TO_CLOUD:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Worker on the CPU:  docker compose --profile cpu up
  worker:
    profiles: ["cpu"]
    build:
      context: ./apps/worker
      args:
        TORCH_INDEX: cpu
    image: singalong-worker:cpu
    command: ["--consume"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      YTDLP_COOKIES: /secrets/youtube_cookies.txt
      # when-asked (the default): no cookie first, the account only when YouTube asks for a login; always; never
      YTDLP_COOKIES_POLICY: ${YTDLP_COOKIES_POLICY:-when-asked}
      DEMUCS_DEVICE: cpu
      # limits and robustness (0 turns the limit off)
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      SEPARATE_TIMEOUT_SECONDS: ${SEPARATE_TIMEOUT_SECONDS:-900}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage
      - ./secrets:/secrets:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
    # the worker touches /tmp/worker-heartbeat every 10 s; without it for 1 min it is stuck
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # gives the song under way time to finish before shutting down
    stop_grace_period: 3m
    restart: unless-stopped

  # Worker with an NVIDIA GPU:  docker compose --profile gpu up
  worker-gpu:
    profiles: ["gpu"]
    build:
      context: ./apps/worker
      args:
        TORCH_INDEX: cu121
    image: singalong-worker:gpu
    command: ["--consume"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      YTDLP_COOKIES: /secrets/youtube_cookies.txt
      YTDLP_COOKIES_POLICY: ${YTDLP_COOKIES_POLICY:-when-asked}
      DEMUCS_DEVICE: cuda
      # limits and robustness (0 turns the limit off)
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
      SEPARATE_TIMEOUT_SECONDS: ${SEPARATE_TIMEOUT_SECONDS:-900}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage
      - ./secrets:/secrets:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
    # the worker touches /tmp/worker-heartbeat every 10 s; without it for 1 min it is stuck
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # gives the song under way time to finish before shutting down
    stop_grace_period: 3m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis-data:
  api-data:
  models:
