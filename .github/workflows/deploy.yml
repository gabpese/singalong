name: Deploy

# After CI passes on main: publishes the API image to the GitHub Container Registry (amd64 and arm64) and, if deploying is
# on (the DEPLOY_ENABLED variable = true), updates the VM by SSH. It can also be started by hand in the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one delivery at a time: two at once would step on each other
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar a imagem da API
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the exact version CI approved (not whatever is at the tip of main now)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the front end is built once, on the runner's architecture; only the server's dependencies are assembled per architecture
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/singalong-api:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/singalong-api:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=api-publish
          cache-to: type=gha,scope=api-publish,mode=max

  deploy:
    name: Atualizar a VM
    needs: publish
    # only after the VM exists and the secrets are registered (deploy/README.md): turn on the DEPLOY_ENABLED variable
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configurar o SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Enviar os arquivos de produção e publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/singalong/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x /opt/singalong/deploy.sh && /opt/singalong/deploy.sh"
