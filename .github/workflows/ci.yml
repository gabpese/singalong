name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# uma execução nova da mesma branch cancela a anterior (economiza minutos e evita resultado velho)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    # um Redis de verdade para os testes de integração dos jobs do agente (streams, scripts Lua, long-poll)
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Front-end (tipos, testes, build e ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      # os testes de ponta a ponta sobem a API de verdade (apps/web/e2e/server.mjs importa apps/api/src)
      - name: Instalar dependências da API
        run: npm ci
        working-directory: apps/api
      - name: Instalar dependências do front-end
        run: npm ci
        working-directory: apps/web
      - name: TypeScript
        run: npm run typecheck
        working-directory: apps/web
      - name: Testes unitários
        run: npm test
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: apps/web
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  worker:
    name: Worker (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # os testes não precisam do torch, do Demucs nem do Whisper: só destes dois
      # websockets: o teste do login do YouTube (cliente do protocolo de depuração) roda contra um servidor WebSocket de verdade
      # yt-dlp: um teste confere os nomes dos extratores permitidos na importação contra a lista real dele
      - run: pip install numpy langdetect websockets yt-dlp
      - run: python -I -m unittest discover -s tests -t .

  engine:
    name: Motor (montagem, em ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # o instalador é de Windows: lá roda o tar.exe de verdade; macos-latest é Apple Silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  # a prova do motor com tudo de verdade: baixa os componentes oficiais (confere o SHA-256 de cada um), instala o torch de CPU
  # e os pacotes, e roda a verificação (ffmpeg com os filtros do karaokê, deno, python e todas as bibliotecas)
  engine-real:
    name: Motor real (baixa e monta, em CPU, no ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest é Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Montar o motor
        run: node apps/engine/src/cli.js assemble --dir "$RUNNER_TEMP/motor" --engine cpu
      - name: Verificar o motor
        run: node apps/engine/src/cli.js verify --dir "$RUNNER_TEMP/motor"
      # a GPU da Apple (opcional, em beta): o executor pode não ter GPU. Se o Metal funcionar o motor fica "mps"; se não, TEM de voltar para a
      # CPU e dizer por quê (esse caminho de volta é o que protege quem escolhe a opção). Qualquer outro resultado é falha.
      - name: Pedir a GPU da Apple (cai para a CPU se não houver Metal)
        if: runner.os == 'macOS'
        run: |
          node apps/engine/src/cli.js assemble --dir "$RUNNER_TEMP/motor-mps" --engine mps
          node apps/engine/src/cli.js status --dir "$RUNNER_TEMP/motor-mps" | tee "$RUNNER_TEMP/mps.json"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/mps.json", "utf8"));
            const ok = s.complete && (s.engine === "mps" || (s.engine === "cpu" && s.fallback_reason));
            console.log(s.engine === "mps" ? "O Metal funciona neste executor: motor mps." : "Sem Metal neste executor: voltou para a CPU (" + s.fallback_reason + ").");
            process.exit(ok ? 0 : 1);
          '

  desktop:
    name: App do dono (controlador em ${{ matrix.os }}; janela só no Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      # a janela de verdade (Electron) falando com a API de verdade e o worker de verdade
      - name: Garantir o binário do Electron
        if: runner.os == 'Windows'
        run: node node_modules/electron/install.js
      - name: Dependências da API
        if: runner.os == 'Windows'
        run: npm ci
        working-directory: apps/api
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"
      - name: Python do worker
        if: runner.os == 'Windows'
        run: pip install numpy langdetect websockets yt-dlp
      - name: Teste de ponta a ponta do app
        if: runner.os == 'Windows'
        run: |
          $env:SINGALONG_TEST_PYTHON = (Get-Command python).Source
          npm run test:e2e
        shell: pwsh

  installer:
    name: Instalador do Windows (gera, sem publicar)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Assinatura do instalador. Com os segredos WINDOWS_CERT_PFX_BASE64 e WINDOWS_CERT_PASSWORD (e, se quiser, a variável WINDOWS_PUBLISHER)
      # ele sai assinado de verdade e o build FALHA se a assinatura não funcionar. Sem eles, o CI assina com um certificado de TESTE
      # descartável (autoassinado), só para provar que o caminho da assinatura funciona (o Windows não confia nele: é esperado).
      - name: Preparar a assinatura
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'singalong-sign.pfx'
          if ($env:CERT_PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            "CSC_LINK=$pfx" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$env:CERT_PASSWORD" >> $env:GITHUB_ENV
            "SINGALONG_REQUIRE_SIGNING=1" >> $env:GITHUB_ENV
            if ($env:PUBLISHER) { "SINGALONG_PUBLISHER=$env:PUBLISHER" >> $env:GITHUB_ENV }
            'assinatura: certificado de verdade (segredos do repositório)'
          } else {
            $password = [Guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Singalong CI (teste)' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) -KeyExportPolicy Exportable
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            "::add-mask::$password"
            "CSC_LINK=$pfx" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV
            'assinatura: certificado de TESTE descartável (o Windows não confia nele)'
          }
      # o instalador NÃO é guardado nem publicado (fica só na máquina do dono): aqui só se confere que ele é gerado (e assinado)
      - run: npm run dist
      - name: Conferir o arquivo gerado
        shell: pwsh
        run: |
          $exe = Get-Item dist/singalong_karaoke.exe
          if ($exe.Length -lt 50MB) { throw "instalador pequeno demais: $($exe.Length)" }
          if (-not (Test-Path dist/latest.yml)) { throw "faltou o latest.yml" }
          "instalador: {0:N0} MB" -f ($exe.Length / 1MB)
      - name: Conferir a assinatura
        run: node scripts/verify-signature.mjs dist/singalong_karaoke.exe

  # o AppImage (Linux) e o DMG (macOS Apple Silicon) são gerados de verdade; o build confere o nome fixo, o tamanho, o executável do Linux
  # e a assinatura ad-hoc do app do Mac (o Apple Silicon encerra programa sem assinatura). Nada é guardado nem publicado.
  installer-unix:
    name: Instalador do ${{ matrix.system }} (gera, sem publicar)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: Linux
          - os: macos-latest
            system: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist

  docker-api:
    name: Imagem da API (build)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # o contexto é a raiz: a primeira etapa constrói o front-end e a API serve o resultado
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  docker-worker:
    name: Imagem do worker (build, só na main)
    runs-on: ubuntu-latest
    needs: [worker]
    # leva vários minutos (torch, Demucs): só quando a main muda ou sob demanda
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/worker
          push: false
          build-args: TORCH_INDEX=cpu
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
