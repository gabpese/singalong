name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new run on the same branch cancels the previous one (it saves minutes and avoids a stale result)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    # a real Redis for the integration tests of the agent's jobs (streams, Lua scripts, long-poll)
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Front-end (tipos, testes, build e ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      # the end-to-end tests run the real API (apps/web/e2e/server.ts imports the compiled apps/api/dist)
      - name: Instalar dependências da API
        run: npm ci
        working-directory: apps/api
      - name: Build the API
        run: npm run build
        working-directory: apps/api
      - name: Instalar dependências do front-end
        run: npm ci
        working-directory: apps/web
      - name: TypeScript
        run: npm run typecheck
        working-directory: apps/web
      - name: Testes unitários
        run: npm test
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: apps/web
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  worker:
    name: Worker (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # the tests need neither torch, Demucs nor Whisper, only these packages:
      # websockets: the YouTube login's test (a client of the debugging protocol) runs against a real WebSocket server
      # yt-dlp: a test checks the extractor names the import allows against its real list
      - run: pip install numpy langdetect websockets yt-dlp
      - run: python -I -m unittest discover -s tests -t .

  engine:
    name: Motor (montagem, em ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # the installer is for Windows: the real tar.exe runs there; macos-latest is Apple Silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Types
        run: npx tsc -p . --noEmit
      # the tests run the .ts sources straight in Node; the desktop app builds dist/ for itself (apps/desktop/scripts/build-engine.ts)
      - run: npm test

  # the proof of the engine with everything real: downloads the official components (checks each one's SHA-256), installs the CPU torch
  # and the packages, and runs the verification (ffmpeg with the karaoke's filters, deno, python and every library)
  engine-real:
    name: Motor real (baixa e monta, em CPU, no ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macos-latest is Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Montar o motor
        run: node apps/engine/src/cli.ts assemble --dir "$RUNNER_TEMP/motor" --engine cpu
      - name: Verificar o motor
        run: node apps/engine/src/cli.ts verify --dir "$RUNNER_TEMP/motor"
      # the Apple GPU (optional, in beta): the runner may have no GPU. If Metal works the engine is "mps"; if not, it HAS to fall back to the
      # CPU and say why (that fallback is what protects whoever picks the option). Any other result is a failure.
      - name: Pedir a GPU da Apple (cai para a CPU se não houver Metal)
        if: runner.os == 'macOS'
        run: |
          node apps/engine/src/cli.ts assemble --dir "$RUNNER_TEMP/motor-mps" --engine mps
          node apps/engine/src/cli.ts status --dir "$RUNNER_TEMP/motor-mps" | tee "$RUNNER_TEMP/mps.json"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/mps.json", "utf8"));
            const ok = s.complete && (s.engine === "mps" || (s.engine === "cpu" && s.fallback_reason));
            console.log(s.engine === "mps" ? "O Metal funciona neste executor: motor mps." : "Sem Metal neste executor: voltou para a CPU (" + s.fallback_reason + ").");
            process.exit(ok ? 0 : 1);
          '
      # the missing measurement: the SAME Demucs on the CPU and on Metal, with 30 s of audio. It only reports (it does not fail): the result goes to the job's summary.
      - name: Medir a separação na CPU e no Metal
        if: runner.os == 'macOS'
        run: |
          MOTOR="$RUNNER_TEMP/motor-mps"
          export PATH="$MOTOR/bin:$PATH" PYTORCH_ENABLE_MPS_FALLBACK=1 TORCH_HOME="$MOTOR/models" PYTHONNOUSERSITE=1
          cd "$RUNNER_TEMP"
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=330:duration=30" -f lavfi -i "anoisesrc=d=30:c=pink:a=0.2" -filter_complex "amix=inputs=2,aformat=channel_layouts=stereo" -ar 44100 bench.wav
          # warm-up: downloads the model (htdemucs) with a short clip, so the download counts for neither of the two
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=330:duration=3" -ac 2 -ar 44100 warm.wav
          "$MOTOR/python/bin/python3" -m demucs --two-stems=vocals -n htdemucs -d cpu -o bench-warm warm.wav > bench-warm.log 2>&1 || true
          for device in cpu mps; do
            start=$(date +%s)
            if "$MOTOR/python/bin/python3" -m demucs --two-stems=vocals -n htdemucs -d "$device" -o "bench-$device" bench.wav > "bench-$device.log" 2>&1; then status=ok; else status="FALHOU"; fi
            echo "$device $status $(( $(date +%s) - start ))" >> bench.txt
            tail -12 "bench-$device.log"
          done
          { echo "### Demucs em 30 s de áudio (macOS do CI)"; echo '```'; cat bench.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  desktop:
    name: App do dono (controlador em ${{ matrix.os }}; janela só no Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # npm test builds first (npm run build): it type-checks the main process and compiles the window and the preloads
      - run: npm test
      # the real window (Electron) talking to the real API and the real worker
      - name: Garantir o binário do Electron
        if: runner.os == 'Windows'
        run: node node_modules/electron/install.js
      - name: Dependências da API
        if: runner.os == 'Windows'
        run: npm ci
        working-directory: apps/api
      - name: Build the API
        if: runner.os == 'Windows'
        run: npm run build
        working-directory: apps/api
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"
      - name: Python do worker
        if: runner.os == 'Windows'
        run: pip install numpy langdetect websockets yt-dlp
      - name: Teste de ponta a ponta do app
        if: runner.os == 'Windows'
        run: |
          $env:SINGALONG_TEST_PYTHON = (Get-Command python).Source
          npm run test:e2e
        shell: pwsh

  installer:
    name: Instalador do Windows (gera, sem publicar)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The installer's signing. With the WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD secrets (and, optionally, the WINDOWS_PUBLISHER variable)
      # it comes out really signed and the build FAILS if the signing does not work. Without them, CI signs with a throwaway TEST
      # certificate (self-signed), only to prove the signing path works (Windows does not trust it: that is expected).
      - name: Preparar a assinatura
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'singalong-sign.pfx'
          if ($env:CERT_PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            "CSC_LINK=$pfx" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$env:CERT_PASSWORD" >> $env:GITHUB_ENV
            "SINGALONG_REQUIRE_SIGNING=1" >> $env:GITHUB_ENV
            if ($env:PUBLISHER) { "SINGALONG_PUBLISHER=$env:PUBLISHER" >> $env:GITHUB_ENV }
            'assinatura: certificado de verdade (segredos do repositório)'
          } else {
            $password = [Guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Singalong CI (teste)' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2) -KeyExportPolicy Exportable
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            "::add-mask::$password"
            "CSC_LINK=$pfx" >> $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV
            'assinatura: certificado de TESTE descartável (o Windows não confia nele)'
          }
      # the installer is NOT kept or published (it stays only on the Owner's machine): this only checks that it is built (and signed)
      - run: npm run dist
      - name: Conferir o arquivo gerado
        shell: pwsh
        run: |
          $exe = Get-Item dist/singalong_karaoke.exe
          if ($exe.Length -lt 50MB) { throw "instalador pequeno demais: $($exe.Length)" }
          if (-not (Test-Path dist/latest.yml)) { throw "faltou o latest.yml" }
          "instalador: {0:N0} MB" -f ($exe.Length / 1MB)
      - name: Conferir a assinatura
        run: node scripts/verify-signature.ts dist/singalong_karaoke.exe

  # the AppImage (Linux) and the DMG (macOS Apple Silicon) are really built; the build checks the fixed name, the size, the Linux executable
  # and the Mac app's ad-hoc signature (Apple Silicon shuts down an unsigned program). Nothing is kept or published.
  installer-unix:
    name: Instalador do ${{ matrix.system }} (gera, sem publicar)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: Linux
          - os: macos-latest
            system: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist

  docker-api:
    name: Imagem da API (build)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # the context is the root: the first stage builds the front end and the API serves the result
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  docker-worker:
    name: Imagem do worker (build, só na main)
    runs-on: ubuntu-latest
    needs: [worker]
    # takes several minutes (torch, Demucs): only when main changes or on demand
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/worker
          push: false
          build-args: TORCH_INDEX=cpu
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
