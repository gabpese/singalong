name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# uma execução nova da mesma branch cancela a anterior (economiza minutos e evita resultado velho)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    name: Front-end (tipos, testes, build e ponta a ponta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json
      # os testes de ponta a ponta sobem a API de verdade (apps/web/e2e/server.mjs importa apps/api/src)
      - name: Instalar dependências da API
        run: npm ci
        working-directory: apps/api
      - name: Instalar dependências do front-end
        run: npm ci
        working-directory: apps/web
      - name: TypeScript
        run: npm run typecheck
        working-directory: apps/web
      - name: Testes unitários
        run: npm test
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: apps/web
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  worker:
    name: Worker (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # os testes não precisam do torch, do Demucs nem do Whisper: só destes dois
      - run: pip install numpy langdetect
      - run: python -I -m unittest discover -s tests -t .

  docker-api:
    name: Imagem da API (build)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # o contexto é a raiz: a primeira etapa constrói o front-end e a API serve o resultado
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  docker-worker:
    name: Imagem do worker (build, só na main)
    runs-on: ubuntu-latest
    needs: [worker]
    # leva vários minutos (torch, Demucs): só quando a main muda ou sob demanda
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/worker
          push: false
          build-args: TORCH_INDEX=cpu
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
