# Production on an always-on VM: API + Redis + Caddy (automatic HTTPS). NO worker: new songs are prepared on the Owner's
# computer; here only the songs in ./storage are played (see deploy/README.md).
#
# Usage (on the VM, in /opt/singalong):  docker compose -f docker-compose.prod.yml --env-file .env up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?defina SITE_ADDRESS no .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # the certificates live here: do not delete it, or Let's Encrypt rate-limits the issuing
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # built by GitHub Actions (.github/workflows/deploy.yml) for amd64 and arm64
    image: ghcr.io/${GHCR_OWNER:-gabpese}/singalong-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000" # only Caddy reaches this; nothing of the API is exposed straight to the internet
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /storage
      DB_PATH: /data/singalong.db
      # the TV's QR code points to this address
      PUBLIC_URL: https://${SITE_ADDRESS}
      # no worker to rebuild deleted songs: the cache cleanup stays off
      CACHE_MAX_GB: "0"
      # the administrator's secret: turns on the local agent's pairing (/agent/v1); empty = off
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # behind Caddy: the caller's IP comes in X-Forwarded-For (for the per-IP request limits)
      TRUST_PROXY: "1"
      # the installed app's update notice: the latest version, the minimum accepted, what changed and where to download it (empty = no notice)
      APP_LATEST_VERSION: "${APP_LATEST_VERSION:-}"
      APP_MIN_VERSION: "${APP_MIN_VERSION:-}"
      APP_NOTES: "${APP_NOTES:-}"
      APP_DOWNLOAD_URL: "${APP_DOWNLOAD_URL:-}"
      # the Intermission (seconds): the Applause after each song and Taking the stage for the next singer (0 turns the phase off)
      INTERMISSION_APPLAUSE_SECONDS: "${INTERMISSION_APPLAUSE_SECONDS:-15}"
      INTERMISSION_STAGE_SECONDS: "${INTERMISSION_STAGE_SECONDS:-15}"
      # the SECRET address of the administrator's page (without it the page does not exist); generate it with: openssl rand -hex 16
      ADMIN_PATH: "${ADMIN_PATH:-}"
      # pairing code by e-mail (optional): whoever is in PAIR_ALLOWED_EMAILS asks for the code in the app and gets it by e-mail
      PAIR_ALLOWED_EMAILS: "${PAIR_ALLOWED_EMAILS:-}"
      # hybrid mode: the computers paired with these e-mails send their songs to the cloud on their own
      ENABLED_TO_SEND_TO_CLOUD: "${ENABLED_TO_SEND_TO_CLOUD:-}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Singalong}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./storage:/storage # must be writable by user 1000 (/readyz writes a test file); see the README
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  api-data:
  caddy-data:
  caddy-config:
