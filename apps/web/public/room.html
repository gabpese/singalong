<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <title>Singalong — Sala</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="room">
  <header class="topbar">
    <div class="topbar-main">
      <h1><span class="icon i-singing" aria-hidden="true"></span>Sala <span id="room-code"></span></h1>
      <p class="tv-status" id="tv-status">Conectando…</p>
    </div>
    <details class="menu" id="menu">
      <summary aria-label="Opções da sala">⋯</summary>
      <div class="menu-panel">
        <button id="open-tv" type="button" class="has-icon"><span class="icon i-display" aria-hidden="true"></span>Abrir TV</button>
        <button id="copy-link" type="button" class="has-icon"><span class="icon i-link" aria-hidden="true"></span>Copiar link da sala</button>
        <button id="copy-host" type="button" class="has-icon" hidden><span class="icon i-host" aria-hidden="true"></span>Copiar link de anfitrião</button>
        <label class="check" id="host-settings" hidden>
          <input id="fair" type="checkbox">
          <span>Rodízio justo<br><small class="muted">a mesma pessoa não canta duas seguidas quando há outra esperando</small></span>
        </label>
      </div>
    </details>
  </header>

  <main class="room-page">
    <section class="tab" id="tab-queue" data-tab="queue">
      <article class="card now" id="now">
        <h2>Tocando agora</h2>
        <div id="now-body"></div>
      </article>

      <article class="card">
        <h2>Na fila <span class="count" id="queue-count"></span></h2>
        <ol class="queue" id="queue"></ol>
        <p class="hint empty" id="queue-empty">Ninguém na fila. Toque em <strong>Adicionar</strong> para escolher uma música.</p>
      </article>
    </section>

    <section class="tab" id="tab-add" data-tab="add" hidden>
      <article class="card add" id="add">
        <h2>Adicionar música</h2>
        <form id="add-form" autocomplete="off">
          <label class="field">Seu nome
            <input id="user-name" type="text" maxlength="30" placeholder="Como você quer aparecer na fila?" autocomplete="nickname">
          </label>

          <div class="row">
            <label class="field">Artista
              <input id="add-artist" type="text" required maxlength="200" placeholder="ex.: Faouzia" autocomplete="off" enterkeyhint="next">
            </label>
            <label class="field">Nome da música
              <input id="add-title" type="text" required maxlength="200" placeholder="ex.: Unethical" autocomplete="off" enterkeyhint="search">
            </label>
          </div>
          <button id="add-search" type="button" class="wide has-icon"><span class="icon i-search" aria-hidden="true"></span>Buscar no YouTube</button>
          <ul class="results" id="add-results" hidden></ul>
          <div class="picked-box" id="add-picked-box" hidden>
            <p class="picked" id="add-picked"></p>
            <button id="add-preview-btn" type="button">Ouvir no YouTube</button>
          </div>
          <div class="video-preview" id="add-preview" hidden></div>
          <details class="link-box" id="add-link-box">
            <summary>Já tenho o link do vídeo</summary>
            <input id="add-url" type="text" placeholder="https://www.youtube.com/watch?v=…" aria-label="Link do vídeo do YouTube">
          </details>

          <label class="field">Letra
            <select id="add-source">
              <option value="lrclib">Buscar a letra na internet</option>
              <option value="auto">Usar a legenda do vídeo, se ele tiver</option>
              <option value="align">Colar a letra e sincronizar com a voz (IA)</option>
              <option value="none">Cantar sem letra (só o instrumental)</option>
              <optgroup label="Avançado">
                <option value="file">Colar uma letra que já tem tempos (.lrc ou .srt)</option>
              </optgroup>
            </select>
          </label>
          <p class="hint" id="add-source-hint"></p>
          <textarea id="add-text" rows="6" placeholder="Cole a letra aqui" aria-label="Letra" hidden></textarea>

          <div class="row actions">
            <button id="add-submit" type="submit" class="primary">Adicionar à fila</button>
            <button id="add-cancel" type="button" hidden>Cancelar</button>
          </div>
          <p class="hint" id="add-status" role="status"></p>
        </form>
      </article>
    </section>

    <section class="tab" id="tab-library" data-tab="library" hidden>
      <article class="card">
        <h2>Músicas já processadas <span class="count" id="library-count"></span></h2>
        <p class="hint">Já estão prontas: entram na fila na hora.</p>
        <div class="filter">
          <input id="library-filter" type="search" placeholder="Filtrar por artista ou nome…" aria-label="Filtrar as músicas já processadas" autocomplete="off" enterkeyhint="search">
        </div>
        <ul class="library" id="library-list"></ul>
        <div class="empty-box" id="library-empty" hidden>
          <p class="hint" id="library-empty-text"></p>
          <button id="library-clear" type="button" hidden>Limpar filtro</button>
        </div>
      </article>
    </section>
  </main>

  <aside class="preview-bar" id="preview-bar" hidden aria-label="Prévia da música">
    <div class="preview-info">
      <strong id="preview-title"></strong>
      <span class="muted small" id="preview-key"></span>
    </div>
    <div class="preview-controls">
      <button id="preview-play" type="button" aria-label="Tocar ou pausar a prévia">&#x25B6;&#xFE0E;</button>
      <input id="preview-seek" type="range" min="0" max="1000" value="0" aria-label="Posição da prévia">
      <span class="pitch">
        <button id="preview-down" type="button" aria-label="Tom mais grave">−</button>
        <span class="pitch-value" id="preview-pitch">Tom 0</span>
        <button id="preview-up" type="button" aria-label="Tom mais agudo">+</button>
      </span>
      <button id="preview-close" type="button" aria-label="Fechar a prévia">✕</button>
    </div>
    <p class="hint small" id="preview-hint"></p>
  </aside>

  <nav class="tabbar" aria-label="Seções">
    <button type="button" data-go="queue" class="active"><span class="icon i-singing" aria-hidden="true"></span><span class="label">Fila <b id="tab-count"></b></span></button>
    <button type="button" data-go="add"><span class="icon i-add-song" aria-hidden="true"></span><span class="label">Adicionar</span></button>
    <button type="button" data-go="library"><span class="icon i-musics" aria-hidden="true"></span><span class="label">Músicas</span></button>
  </nav>

  <p class="toast" id="toast" role="status"></p>
  <script type="module" src="room.js"></script>
</body>
</html>
