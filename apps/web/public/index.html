<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Singalong</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing">
  <main class="landing-page">
    <h1><span class="icon i-singing" aria-hidden="true"></span>Singalong</h1>
    <p class="lead">Karaokê de qualquer vídeo do YouTube: o instrumental, a letra sincronizada e a fila da festa.</p>

    <section class="card">
      <h2>Criar uma sala</h2>
      <p class="hint">Você será o anfitrião: escolhe a ordem, pula e pausa. A TV abre em outra aba.</p>
      <button id="create" type="button" class="primary big">Criar sala e abrir a TV</button>
    </section>

    <section class="card">
      <h2>Entrar numa sala</h2>
      <form id="join-form" class="row" autocomplete="off">
        <input id="join-code" type="text" inputmode="text" maxlength="8" placeholder="Código (ex.: K7QM)" aria-label="Código da sala" required>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <p class="hint" id="status" role="status"></p>
  </main>
  <script type="module" src="landing.js"></script>
</body>
</html>
